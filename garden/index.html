<head>
	<link rel="stylesheet" href="/style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>lyrical.garden</title>
    <link rel="icon" type="image/png" href="/images/favicon.png">
    <meta name="theme-color" content="#101d30">
</head>

<body>
	<div class="lg-root">
		<nav class="lg-nav">
			<div class="lg-brand">
				<div class="lg-card-icon">
					<a href="/index.html">
						<img src="/images/favicon_square.png" style="width: 40px; height: 40px; border-radius: 50%; object-fit: cover;">
					</a>
				</div>
				<div class="lg-title-block">
					<h1 class="lg-title-small wave-text">
						<span>l</span><span>y</span><span>r</span><span>i</span><span>c</span><span>a</span><span>l</span><span class="green">.</span><span>g</span><span>a</span><span>r</span><span>d</span><span>e</span><span>n</span>
					</h1>
					<p class="lg-sub-small" id="lg-sub-small"></p>
				</div>
			</div>

			<div class="lg-nav-links">
				<a href="/" class="lg-card-link">
					<div class="lg-card lg-card-nav">
						<div class="lg-card-image home"></div>
					</div>
				</a>
				<a href="/music/" class="lg-card-link">
					<div class="lg-card lg-card-nav">
						<div class="lg-card-image music"></div>
					</div>
				</a>
				<div class="lg-card lg-card-nav-current">
					<div class="lg-card-image garden"></div>
				</div>
				<a href="/blog/" class="lg-card-link">
					<div class="lg-card lg-card-nav">
						<div class="lg-card-image blog"></div>
					</div>
				</a>
			</div>
		</nav>
		
		<div class="game-embed">
			<iframe
				src="/garden/lyrical.garden/lyrical.garden.html"
				class="game-frame"
				allowfullscreen allow="fullscreen"
			></iframe>
			<button id="fullscreen-btn" class="fullscreen-btn" aria-label="Fullscreen">
				⛶
			</button>
		</div>

		<div class="lg-footer">© lyrical.garden (but not actually) 🌱</div>
	</div>
</body>

<img src="/images/corner.png" class="lg-corner lg-corner-tl" alt="">
<img src="/images/corner.png" class="lg-corner lg-corner-tr" alt="">
<img src="/images/corner.png" class="lg-corner lg-corner-bl" alt="">
<img src="/images/corner.png" class="lg-corner lg-corner-br" alt="">
<script src="/quotes.js"></script>
<script>showRandomQuote("lg-sub-small");</script>

<script>
	document.getElementById('fullscreen-btn').addEventListener('click', () => {
	const frame = document.querySelector('.game-frame');
	if (frame.requestFullscreen) {
	frame.requestFullscreen();
	} else if (frame.webkitRequestFullscreen) {
	frame.webkitRequestFullscreen();
	}
	});
</script>
