<head>
	<link rel="stylesheet" href="/style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>lyrical.garden</title>
    <link rel="icon" type="image/png" href="/images/favicon.png">
    <meta name="theme-color" content="#101d30">
</head>

<body>
	<div class="lg-root">
		<div class="lg-hero">
			<div class="lg-card-icon">
				<img src="images/favicon_square.png" style="width: 200px; height: 200px; border-radius: 50%; object-fit: cover;">
			</div>
			<h1 class="lg-title">
				<h1 class="lg-title wave-text"><span>l</span><span>y</span><span>r</span><span>i</span><span>c</span><span>a</span><span>l</span><span class="green">.</span><span>g</span><span>a</span><span>r</span><span>d</span><span>e</span><span>n</span></h1>
			</h1>
			<p class="lg-sub" id="lg-sub"></p>
			<!-- <span class="lg-card-compact">✽ Garden is WIP ✽</span> -->
			<!-- <div class="lg-divider"></div> -->
		</div>
		<div class="lg-cards">
			<a href="music/" class="lg-card-link">
				<div class="lg-card">
					<div class="lg-card-image music"></div>
					<p class="lg-card-title">listen to music</p>
					<p class="lg-card-desc">lil' snacks for your ears</p>
				</div>
			</a>
			<a href="garden/" class="lg-card-link">
				<div class="lg-card">
					<div class="lg-card-image garden"></div>
					<p class="lg-card-title">explore the garden</p>
					<p class="lg-card-desc">🚧 Work in progress 🚧</p>
				</div>
			</a>
			<a href="blog/" class="lg-card-link">
				<div class="lg-card">
					<div class="lg-card-image blog"></div>
					<p class="lg-card-title">read some words</p>
					<p class="lg-card-desc">ideas that sprouted legs</p>
				</div>
			</a>
		</div>
		<div class="lg-footer">© lyrical.garden (but not actually) 🌱</div>
	</div>
</body>

<img src="/images/corner.png" class="lg-corner lg-corner-tl" alt="">
